# .gitlab-ci.yml
stages:
  - test

# Frontend testen
frontend-test:
  stage: test
  image: node:20
  cache:
    key: frontend
    paths:
      - frontend/node_modules/
  before_script:
    - cd frontend
    - npm ci
  variables:
    VITE_API_URL: "http://localhost:3001"
  script:
    - npm test

lint-frontend:
  image: node:20
  stage: test
  cache:
    paths:
      - frontend/node_modules/
    key: frontend-$CI_COMMIT_REF_SLUG
  script:
    - cd frontend
    - npm ci
    - npm run lint

lint-backend:
  image: node:20
  stage: test
  cache:
    paths:
      - backend/node_modules/
    key: backend-$CI_COMMIT_REF_SLUG
  script:
    - cd backend
    - npm ci
    - npm run lint
